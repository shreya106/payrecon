# Used only when SPRING_PROFILES_ACTIVE=prod (on Render)

# Render tells the app which port to use
server.port=${PORT:8080}

# No Docker Compose in production; the database is Neon
spring.docker.compose.enabled=false

# No default here: if the secret is missing, the app refuses to start
payrecon.admin-token=${PAYRECON_ADMIN_TOKEN}